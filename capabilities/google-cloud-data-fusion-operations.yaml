naftiko: 1.0.0-alpha2
info:
  label: Google Cloud Data Fusion API — Operations
  description: 'Google Cloud Data Fusion API — Operations. 2 operations. Lead operation: Google Cloud Data Fusion List operations.
    Self-contained Naftiko capability covering one Google Cloud Data Fusion business surface.'
  tags:
  - Google Cloud Data Fusion
  - Operations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CLOUD_DATA_FUSION_API_KEY: GOOGLE_CLOUD_DATA_FUSION_API_KEY
capability:
  consumes:
  - type: http
    namespace: google-cloud-data-fusion-operations
    baseUri: https://datafusion.googleapis.com/v1
    description: Google Cloud Data Fusion API — Operations business capability. Self-contained, no shared references.
    resources:
    - name: projects-projectId-locations-location-operations
      path: /projects/{projectId}/locations/{location}/operations
      operations:
      - name: listoperations
        method: GET
        description: Google Cloud Data Fusion List operations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
    - name: projects-projectId-locations-location-operations-operationId
      path: /projects/{projectId}/locations/{location}/operations/{operationId}
      operations:
      - name: getoperation
        method: GET
        description: Google Cloud Data Fusion Get an operation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: location
          in: path
          type: string
          required: true
        - name: operationId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.GOOGLE_CLOUD_DATA_FUSION_API_KEY}}'
  exposes:
  - type: rest
    namespace: google-cloud-data-fusion-operations-rest
    port: 8080
    description: REST adapter for Google Cloud Data Fusion API — Operations. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/projects/{projectid}/locations/{location}/operations
      name: projects-projectid-locations-location-operations
      description: REST surface for projects-projectId-locations-location-operations.
      operations:
      - method: GET
        name: listoperations
        description: Google Cloud Data Fusion List operations
        call: google-cloud-data-fusion-operations.listoperations
        with:
          projectId: rest.projectId
          location: rest.location
          pageSize: rest.pageSize
          pageToken: rest.pageToken
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{projectid}/locations/{location}/operations/{operationid}
      name: projects-projectid-locations-location-operations-operationid
      description: REST surface for projects-projectId-locations-location-operations-operationId.
      operations:
      - method: GET
        name: getoperation
        description: Google Cloud Data Fusion Get an operation
        call: google-cloud-data-fusion-operations.getoperation
        with:
          projectId: rest.projectId
          location: rest.location
          operationId: rest.operationId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: google-cloud-data-fusion-operations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Cloud Data Fusion API — Operations. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: google-cloud-data-fusion-list
      description: Google Cloud Data Fusion List operations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-data-fusion-operations.listoperations
      with:
        projectId: tools.projectId
        location: tools.location
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
    - name: google-cloud-data-fusion-get
      description: Google Cloud Data Fusion Get an operation
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-data-fusion-operations.getoperation
      with:
        projectId: tools.projectId
        location: tools.location
        operationId: tools.operationId
      outputParameters:
      - type: object
        mapping: $.

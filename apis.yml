aid: google-cloud-data-fusion
name: Google Cloud Data Fusion
description: >-
  Google Cloud Data Fusion is a fully managed, cloud-native data integration service that helps users build and manage
  ETL/ELT data pipelines. It provides a visual point-and-click interface for building data transformation pipelines,
  powered by the open-source CDAP framework.
